name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 30 минут избыточно для змейки, 10 — безопаснее

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Files
        uses: Platane/snk@v3.2.0
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Расширенное логирование состояния перед деплоем
      - name: Detailed Build Log
        if: always()
        run: |
          echo "=== Отчет о генерации ==="
          echo "Рабочая директория: $GITHUB_WORKSPACE"
          if [ -d "dist" ]; then
            echo "Список созданных файлов в dist/:"
            ls -lh dist/
          else
            echo "Ошибка: Директория dist не найдена!"
            exit 1
          fi

      # Используем только один метод деплоя (самый надежный для этого случая)
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4 # Обновлено до v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final Status Report
        if: failure()
        run: |
          echo "::error title=Workflow Failed::Ошибка при генерации или пуше змейки. Проверьте разрешения GITHUB_TOKEN."
